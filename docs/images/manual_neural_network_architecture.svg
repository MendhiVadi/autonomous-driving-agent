    <text x="954" y="238">Steering angle</text><text x="954" y="309">Accelerator</text><text x="954" y="380">Brake</text>
    <text x="954" y="451">Clutch position</text><text x="954" y="522">Gear request R/N/1–6</text>
  </g>
  <rect x="465" y="603" width="750" height="55" rx="12" fill="#162235" stroke="#526277"/>
  <text x="840" y="627" text-anchor="middle" fill="#c5d0de" font-family="Segoe UI,Arial" font-size="15">Safety supervisor remains outside the neural network</text>
  <text x="840" y="648" text-anchor="middle" fill="#8fa1b8" font-family="Segoe UI,Arial" font-size="14">Reject unsafe shifts · prevent throttle/brake conflict · stop on hazards</text>
  <text x="64" y="690" fill="#8fa1b8" font-family="Segoe UI,Arial" font-size="14">Current loaded baseline remains 8 → 24 → 16 → 3 and was not overwritten.</text>
</svg>
